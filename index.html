<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        // src/hooks/useDarkMode.ts의 getInitialTheme()과 반드시 동일한 로직으로 유지하세요.
        // React 마운트/첫 페인트 전에 .dark와 theme-color를 동기적으로 적용하기 위한 중복 구현입니다.
        // 위의 theme-color meta 태그보다 뒤에 있어야 querySelector로 찾을 수 있습니다.
        var STORAGE_KEY = "danjilog:theme";
        var stored = localStorage.getItem(STORAGE_KEY);
        var isDark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("dark");
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", isDark ? "#000000" : "#ffffff");
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="danjiLog" />
    <meta name="description" content="고양이 음수량과 식사량을 가족이 함께 기록하는 앱" />
    <title>danjiLog - 고양이 급수급식 기록</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
